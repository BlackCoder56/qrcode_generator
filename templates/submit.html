<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your QR Pass</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        // Follow the user's system light/dark mode preference
        tailwind.config = {
            darkMode: 'media'
        }
    </script>
</head>

<body class="min-h-screen flex items-center justify-center
             bg-gray-50 dark:bg-gray-950
             text-gray-900 dark:text-white
             transition-colors duration-500">

    <main class="w-full max-w-md px-4">

        <!-- QR Pass Card -->
        <div class="bg-white dark:bg-gray-900
                    border border-gray-200 dark:border-gray-800
                    rounded-3xl
                    shadow-xl
                    p-6 sm:p-7
                    text-center">

            <!-- Success Icon -->
            <div class="mx-auto mb-4
                        w-12 h-12
                        flex items-center justify-center
                        rounded-full
                        bg-blue-100 dark:bg-blue-950
                        text-blue-600 dark:text-blue-400">

                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="2"
                     stroke="currentColor"
                     class="w-6 h-6">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M5 13l4 4L19 7" />

                </svg>

            </div>


            <!-- Heading -->
            <h1 class="text-2xl sm:text-3xl
                       font-bold
                       tracking-tight
                       text-blue-600 dark:text-blue-400">

                Your QR Pass is Ready

            </h1>


            <!-- Description -->
            <p class="mt-3
                      text-sm sm:text-base
                      text-gray-600 dark:text-gray-400
                      leading-relaxed">

                Scan this QR code with your phone to
                automatically verify your pass.

            </p>


            <!-- QR Code -->
            <div class="mt-5
                        inline-flex
                        p-3
                        bg-white
                        rounded-2xl
                        border border-gray-200
                        shadow-lg">

                <img src="data:image/png;base64,{{ qr_image }}"
                     alt="QR Verification Code"
                     class="w-44 h-44 sm:w-48 sm:h-48">

            </div>


            <!-- Expiration -->
            {% if expires_at %}
                <div class="mt-4
                            flex flex-col items-center gap-1
                            text-sm">

                    <span class="text-gray-500 dark:text-gray-500">
                        Valid until
                    </span>

                    <span class="font-semibold
                                 text-gray-700 dark:text-gray-300">

                        {{ expires_at.strftime('%B %d, %Y at %I:%M %p') }}

                    </span>

                </div>
            {% endif %}


            <!-- Instructions -->
            <div class="mt-4
                        p-3
                        rounded-xl
                        bg-gray-50 dark:bg-gray-800
                        text-sm
                        text-gray-600 dark:text-gray-400">

                📱 Open your phone's camera and point it
                at the QR code to verify this pass.

            </div>


            <!-- Generate Another -->
            <form action="{{ url_for('submit') }}"
                  method="POST"
                  class="mt-4">

                <button type="submit"
                        class="w-full
                               bg-blue-600 hover:bg-blue-700
                               dark:bg-blue-500 dark:hover:bg-blue-600
                               text-white
                               text-sm sm:text-base
                               font-semibold
                               py-3 px-5
                               rounded-xl
                               shadow-lg
                               shadow-blue-500/20
                               transition-all duration-300
                               hover:-translate-y-0.5
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:ring-offset-2
                               dark:focus:ring-offset-gray-900">

                    Generate Another QR Pass

                </button>

            </form>


            <!-- Back Home -->
            <a href="{{ url_for('index') }}"
               class="inline-block mt-4
                      text-sm
                      font-medium
                      text-gray-500 dark:text-gray-400
                      hover:text-blue-600 dark:hover:text-blue-400
                      transition-colors duration-300">

                ← Back to Home

            </a>

        </div>

    </main>

</body>
</html>
