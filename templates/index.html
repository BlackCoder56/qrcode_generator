<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Pass Generator</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        // Follow the user's system light/dark mode preference
        tailwind.config = {
            darkMode: 'media'
        }
    </script>
</head>

<body class="min-h-screen flex items-center justify-center
             bg-gray-50 dark:bg-gray-950
             text-gray-900 dark:text-white
             transition-colors duration-500">

    <main class="w-full max-w-lg px-6">

        <!-- Main Card -->
        <div class="bg-white dark:bg-gray-900
                    border border-gray-200 dark:border-gray-800
                    rounded-3xl
                    shadow-xl
                    p-8 sm:p-10
                    text-center">

            <!-- Icon -->
            <div class="mx-auto mb-6
                        w-16 h-16
                        flex items-center justify-center
                        rounded-2xl
                        bg-blue-100 dark:bg-blue-950
                        text-blue-600 dark:text-blue-400">

                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="1.8"
                     stroke="currentColor"
                     class="w-8 h-8">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M3.75 4.5A.75.75 0 0 1 4.5 3.75h4.25a.75.75 0 0 1 .75.75v4.25a.75.75 0 0 1-.75.75H4.5a.75.75 0 0 1-.75-.75V4.5ZM14.5 3.75h4.25a.75.75 0 0 1 .75.75v4.25a.75.75 0 0 1-.75.75H14.5a.75.75 0 0 1-.75-.75V4.5a.75.75 0 0 1 .75-.75ZM3.75 14.5a.75.75 0 0 1 .75-.75h4.25a.75.75 0 0 1 .75.75v4.25a.75.75 0 0 1-.75.75H4.5a.75.75 0 0 1-.75-.75V14.5ZM14.5 14.5h2.25v2.25H14.5V14.5ZM18.25 14.5h1.25v1.25h-1.25V14.5ZM14.5 18.25h1.25v1.25H14.5v-1.25ZM17.25 17.25h2.25v2.25h-2.25v-2.25Z" />

                </svg>
            </div>


            <!-- Heading -->
            <h1 class="text-3xl sm:text-4xl
                       font-bold
                       tracking-tight
                       text-blue-600 dark:text-blue-400">

                Create a Secure QR Pass
            </h1>


            <!-- Description -->
            <p class="mt-4
                      text-gray-600 dark:text-gray-400
                      leading-relaxed">

                Generate a unique QR pass that can be scanned
                and automatically verified through our secure
                verification system.
            </p>


            <!-- Generate Form -->
            <form action="{{ url_for('submit') }}"
                  method="POST"
                  class="mt-8">

                <button type="submit"
                        class="w-full
                               bg-blue-600 hover:bg-blue-700
                               dark:bg-blue-500 dark:hover:bg-blue-600
                               text-white
                               font-semibold
                               py-3.5 px-6
                               rounded-xl
                               shadow-lg
                               shadow-blue-500/20
                               transition-all duration-300
                               hover:-translate-y-0.5
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:ring-offset-2
                               dark:focus:ring-offset-gray-900">

                    Generate QR Pass
                </button>

            </form>


            <!-- Small Information -->
            <div class="mt-6
                        flex items-center justify-center gap-2
                        text-sm
                        text-gray-500 dark:text-gray-500">

                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="1.8"
                     stroke="currentColor"
                     class="w-4 h-4">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M12 9v3.75m0 3.75h.008v.008H12v-.008ZM10.34 3.94 2.97 17.25A1.5 1.5 0 0 0 4.28 19.5h15.44a1.5 1.5 0 0 0 1.31-2.25L13.66 3.94a1.5 1.5 0 0 0-3.32 0Z" />

                </svg>

                <span>
                    Each pass is generated with a unique secure token.
                </span>

            </div>

        </div>

    </main>

</body>
</html>
